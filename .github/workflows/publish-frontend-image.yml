# Builds the frontend image for the Raspberry Pi (arm64 and 32-bit arm) and
# pushes it to GitHub Container Registry. Watchtower on the Pi notices the new
# :latest and restarts the container. See frontend/README.md ("Deploying").
name: Publish frontend image

on:
  push:
    branches: [main]
    paths:
      - frontend/**
      - .github/workflows/publish-frontend-image.yml
  workflow_dispatch:

env:
  # docker/metadata-action lowercases this, as GHCR requires.
  IMAGE: ghcr.io/${{ github.repository }}-frontend

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: frontend
          platforms: linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
