# Alternative to compose.yaml for deploying with Watchtower: the Pi pulls the
# image that the "Publish frontend image" workflow builds, rather than
# building it itself.
#
#   docker compose -f compose.watchtower.yaml up -d
#
# Use this OR compose.yaml (with the self-hosted runner), not both at once:
# they share the container name, the port and /dev/ttyUSB0. The project name
# below matches the directory compose.yaml defaults to, so both files use the
# same settings volume and switching between them keeps your settings.
name: frontend

services:
  web:
    image: ghcr.io/mdub555/splitflapdisplay-frontend:latest
    restart: always
    ports:
      - "${APP_PORT}:5000"
    volumes:
      - splitflap-settings:/code/data
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
    labels:
      # Watchtower only touches containers carrying this label.
      - com.centurylinklabs.watchtower.enable=true

  watchtower:
    image: nickfedor/watchtower:latest
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Only needed if the image is private: `docker login ghcr.io` on the
      # Pi, then uncomment so Watchtower can use the same credentials.
      # - ${HOME}/.docker/config.json:/config.json:ro
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: "300"

volumes:
  splitflap-settings:
